<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YESA — Incubator for Future Leaders</title>
    <meta name="description" content="YESA is a 100% free incubator designed to help people gradually develop into future leaders through structured real-world progression. Choose your field. We provide the path." />
    <meta name="theme-color" content="#08090B" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="YESA — Incubator for Future Leaders" />
    <meta property="og:description" content="A 100% free incubator designed to guide ambitious individuals from initial curiosity into world-class institutional leadership. Choose your field. We provide the path." />
    <meta property="og:site_name" content="YESA" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YESA — Incubator for Future Leaders" />
    <meta name="twitter:description" content="A 100% free incubator. Choose your field. We provide the path." />
    
    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600;1,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Theme Initialization Script (Avoids flash of wrong theme on reload) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('yesa-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#08090B] text-[#F3F5F7] antialiased selection:bg-sky-500/30 selection:text-sky-200 overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
